# ************************* JAVA EXCEPTIONS ************************* #
java.lang.Exception=error inesperado
java.lang.NullPointerException=valor nulo inesperado
# ************************* SPRING EXCEPTIONS ************************* #
org.springframework.http.converter.HttpMessageNotReadableException=error inesperado procesando contenido de la respuesta
org.springframework.web.bind.MethodArgumentNotValidException=argumento no válido
org.springframework.web.bind.MissingServletRequestParameterException=falta el parámetro '{0}' (tipo: {1})
