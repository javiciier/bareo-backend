# ************************* JAVA EXCEPTIONS ************************* #
java.lang.Exception=an unexpected error ocurred
java.lang.NullPointerException=unhandled null value
# ************************* SPRING EXCEPTIONS ************************* #
org.springframework.http.converter.HttpMessageNotReadableException=unexpected error processing request content
org.springframework.web.bind.MethodArgumentNotValidException=argument not valid
org.springframework.web.bind.MissingServletRequestParameterException=missing request parameter '{0}' (type: {1})


