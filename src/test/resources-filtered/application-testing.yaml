spring:
  config:
    import: "file:../.test.env[.properties]"
  datasource:
    url: 'jdbc:postgresql://localhost:5431/bareo_test'
    username: 'testuser'
    password: 'password'
  docker:
    compose:
      enabled: true
      readiness:
        timeout: 30s
      file: ../docker/compose/compose-test.yaml
      skip:
        in-tests: false
      stop:
        command: down
        timeout: 20s
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  config: 'classpath:log4j2-test.xml'

myate:
  banner:
    mode: "[TESTING mode]"
