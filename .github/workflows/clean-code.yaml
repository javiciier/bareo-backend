name: Code formatting

on:
  pull_request:
    branches:
      - release
      - hotfix
      - develop
      - staging
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  format-code:
    name: Format code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: ☕ Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'

      - name: 📝 Run Spotless Apply
        run: mvn spotless:apply -B --no-transfer-progress

      - name: 🫡 Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "ci: code formatting"
          branch: ${{ github.event.pull_request.head.ref }}
