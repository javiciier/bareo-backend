name: Run test suites

on:
  push:
    branches:
      - main
      - release
      - hotfix
      - develop
      - staging
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  execute-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      # Allow writting comments on pull requests
      pull-requests: write

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'

      - name: 🏗️ Build and Execute tests
        run: mvn clean verify -B -U -P'testing,!development'

      - name: 📊 JaCoCo Coverage Report
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        if: github.event_name == 'pull_request'
        with:
          title: 'Bareo Coverage Report'
          paths: ${{ github.workspace }}/target/site/jacoco-aggregate/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 60
          update-comment: true
          comment-type: pr_comment
          pass-emoji: 👍
          fail-emoji: 👎
          continue-on-error: true
